function columnsFor(rooms, floor, structure) {
  const st = STRUCT[structure] || STRUCT.wood,
    g = st.span,
    cells = floorCellSet(rooms, floor, false);
  if (cells.size === 0) return [];
  let x0 = 1e9,
    y0 = 1e9,
    x1 = -1e9,
    y1 = -1e9;
  for (const k of cells) {
    const [x, y] = k.split(",").map(Number);
    x0 = Math.min(x0, x);
    y0 = Math.min(y0, y);
    x1 = Math.max(x1, x + 1);
    y1 = Math.max(y1, y + 1);
  }
  const has = (x, y) => cells.has(x + "," + y);
  const nAround = (vx, vy) => (has(vx - 1, vy - 1) ? 1 : 0) + (has(vx, vy - 1) ? 1 : 0) + (has(vx - 1, vy) ? 1 : 0) + (has(vx, vy) ? 1 : 0);
  const pts = [],
    seen = new Set(),
    add = (vx, vy) => {
      const n = nAround(vx, vy);
      if (n === 0) return;
      const k = vx + "," + vy;
      if (seen.has(k)) return;
      seen.add(k);
      pts.push([vx, vy]);
    };
  for (let vx = x0; vx <= x1; vx += g) for (let vy = y0; vy <= y1; vy += g) add(vx, vy);
  for (let vx = x0; vx <= x1; vx++) for (let vy = y0; vy <= y1; vy++) {
    const n = nAround(vx, vy);
    if (n === 1 || n === 3) add(vx, vy);
  }
  return pts;
}
